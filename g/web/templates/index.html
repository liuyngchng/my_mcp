<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/static/lib/purify.min.js"></script>
    <script src="/static/lib/marked.min.js"></script>
    <link rel="stylesheet" href="/static/lib/font-awesome.all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>{{.page_title}}</title>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-terminal"></i> {{.page_title}}</h1>
            <div class="system-settings-link-container">
                <button id="newChat" class="btn-clear" title="新对话">
                    <i class="fas fa-plus-circle"></i> 新对话
                </button>
                <button id="refreshTools" class="btn-clear" title="刷新工具列表">
                    <i class="fas fa-sync-alt"></i> 刷新工具
                </button>
            </div>
        </header>

        <div class="welcome-banner welcome-admin">
            <i class="fas fa-plug"></i> 通过自然语言查询 MCP 服务，支持 {{.page_title}} 自由对话
        </div>

        <div class="chat-container" id="chat-container">
        </div>

        <form id="query-form">
            <div class="input-container">
                <input type="text" class="input-field" id="query-input" name="msg"
                       placeholder="请输入您的问题，比如：'查询去年的天然气使用量'..." required autocomplete="off">
                <div class="button-container">
                    <button type="submit" class="send-button" id="send-button">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                    <button type="button" class="stop-button" id="stop-button">
                        <i class="fas fa-stop"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
